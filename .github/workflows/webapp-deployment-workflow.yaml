name: Deploy Azure Web App

on:
  push:
    branches:
      - main
      - feature_infra
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_terraform:
        description: 'Force Terraform execution regardless of changes'
        required: false
        type: boolean
        default: false

env:
  TERRAFORM_VERSION: '1.6.0'
  PYTHON_VERSION: '3.9'
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  
# Set permissions for OIDC authentication
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # Job 1: Check for Terraform changes and apply infrastructure
  terraform:
    name: 'Terraform Infrastructure'
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.terraform_output.outputs.app_name }}
      resource_group: ${{ steps.terraform_output.outputs.resource_group }}
      app_url: ${{ steps.terraform_output.outputs.app_url }}
      terraform_applied: ${{ steps.check_changes.outputs.terraform_changed || github.event.inputs.force_terraform }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for proper diff
    
    - name: Check for Terraform changes
      id: check_changes
      run: |
        # Check if terraform directory has changes
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
        else
          BASE_SHA=${{ github.event.before }}
          HEAD_SHA=${{ github.event.after }}
        fi
        
        # For workflow_dispatch or first commit, always run
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]; then
          echo "terraform_changed=true" >> $GITHUB_OUTPUT
          echo "📋 Terraform will run: workflow_dispatch or initial commit"
        else
          # Check for changes in terraform directory
          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA | grep '^terraform/' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "terraform_changed=true" >> $GITHUB_OUTPUT
            echo "📋 Terraform changes detected:"
            echo "$CHANGED_FILES"
          else
            echo "terraform_changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No Terraform changes detected"
          fi
        fi
    
    - name: Azure Login
      if: steps.check_changes.outputs.terraform_changed == 'true' || github.event.inputs.force_terraform == 'true'
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.ARM_CLIENT_ID }}
        tenant-id: ${{ secrets.ARM_TENANT_ID }}
        subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    
    - name: Setup Terraform
      if: steps.check_changes.outputs.terraform_changed == 'true' || github.event.inputs.force_terraform == 'true'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        terraform_wrapper: false
    
    - name: Terraform Init
      if: steps.check_changes.outputs.terraform_changed == 'true' || github.event.inputs.force_terraform == 'true'
      working-directory: ./terraform
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ secrets.TERRAFORM_STATE_RG }}" \
          -backend-config="storage_account_name=${{ secrets.TERRAFORM_STATE_SA }}" \
          -backend-config="container_name=${{ secrets.TERRAFORM_STATE_CONTAINER }}" \
          -backend-config="key=terraform.tfstate"
    
    - name: Terraform Format Check
      if: steps.check_changes.outputs.terraform_changed == 'true' || github.event.inputs.force_terraform == 'true'
      working-directory: ./terraform
      run: terraform fmt -check -recursive
    
    - name: Terraform Validate
      if: steps.check_changes.outputs.terraform_changed == 'true' || github.event.inputs.force_terraform == 'true'
      working-directory: ./terraform
      run: terraform validate
    
    - name: Terraform Plan
      if: steps.check_changes.outputs.terraform_changed == 'true' || github.event.inputs.force_terraform == 'true'
      working-directory: ./terraform
      run: |
        terraform plan -out=tfplan \
          -var="environment=${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}"
    
    - name: Terraform Apply
      if: (steps.check_changes.outputs.terraform_changed == 'true' || github.event.inputs.force_terraform == 'true') && github.ref == 'refs/heads/main'
      working-directory: ./terraform
      run: terraform apply -auto-approve tfplan
    
    - name: Get Terraform Outputs
      id: terraform_output
      if: steps.check_changes.outputs.terraform_changed == 'true' || github.event.inputs.force_terraform == 'true'
      working-directory: ./terraform
      run: |
        # Get outputs even if terraform didn't run (from state)
        terraform init \
          -backend-config="resource_group_name=${{ secrets.TERRAFORM_STATE_RG }}" \
          -backend-config="storage_account_name=${{ secrets.TERRAFORM_STATE_SA }}" \
          -backend-config="container_name=${{ secrets.TERRAFORM_STATE_CONTAINER }}" \
          -backend-config="key=terraform.tfstate" || true
        
        APP_NAME=$(terraform output -raw app_service_name || echo "")
        RESOURCE_GROUP=$(terraform output -raw resource_group_name || echo "")
        APP_URL=$(terraform output -raw app_service_url || echo "")
        
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
        echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
        
        echo "📋 Terraform Outputs:"
        echo "  App Name: $APP_NAME"
        echo "  Resource Group: $RESOURCE_GROUP"
        echo "  App URL: $APP_URL"
    
    - name: Comment PR with Terraform Plan
      if: github.event_name == 'pull_request' && (steps.check_changes.outputs.terraform_changed == 'true' || github.event.inputs.force_terraform == 'true')
      uses: actions/github-script@v7
      with:
        script: |
          const output = `#### Terraform Plan 📖
          
          <details><summary>Show Plan</summary>
          
          \`\`\`
          ${{ steps.terraform_plan.outputs.stdout }}
          \`\`\`
          
          </details>
          
          *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

  # Job 2: Package and Deploy Application
  deploy:
    name: 'Package and Deploy Application'
    runs-on: ubuntu-latest
    needs: terraform
    if: always() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.ARM_CLIENT_ID }}
        tenant-id: ${{ secrets.ARM_TENANT_ID }}
        subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    
    - name: Get App Service details
      id: get_app_details
      run: |
        # If terraform didn't run, get values from Azure
        if [ -z "${{ needs.terraform.outputs.app_name }}" ]; then
          echo "Getting App Service details from Azure..."
          APP_NAME=$(az webapp list --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} --query "[0].name" -o tsv)
          RESOURCE_GROUP=${{ secrets.RESOURCE_GROUP_NAME }}
          APP_URL="https://${APP_NAME}.azurewebsites.net"
        else
          APP_NAME="${{ needs.terraform.outputs.app_name }}"
          RESOURCE_GROUP="${{ needs.terraform.outputs.resource_group }}"
          APP_URL="${{ needs.terraform.outputs.app_url }}"
        fi
        
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
        echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
    
    - name: Create deployment package
      run: |
        echo "📦 Creating deployment package..."
        
        # Create directory structure
        mkdir -p app/public
        mkdir -p app/logs
        mkdir -p app/tmp
        
        # Copy application files
        cp index.html app/public/
        cp nginx.conf app/
        cp startup.sh app/
        
        # Make startup script executable
        chmod +x app/startup.sh
        
        # Create error pages
        cat > app/public/404.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>404 - Page Not Found</title>
            <style>
                body {
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    min-height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: #ffffff;
                    margin: 0;
                }
                .container {
                    text-align: center;
                    padding: 2rem;
                    background: rgba(255, 255, 255, 0.1);
                    backdrop-filter: blur(10px);
                    border-radius: 20px;
                }
                h1 { font-size: 6rem; margin: 0; }
                a {
                    color: #ffffff;
                    text-decoration: none;
                    border: 2px solid #ffffff;
                    padding: 0.5rem 1.5rem;
                    border-radius: 25px;
                    display: inline-block;
                    margin-top: 1rem;
                }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>404</h1>
                <h2>Page Not Found</h2>
                <a href="/">Go Home</a>
            </div>
        </body>
        </html>
        EOF
        
        cat > app/public/50x.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Server Error</title>
            <style>
                body {
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    min-height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: #ffffff;
                    margin: 0;
                }
                .container {
                    text-align: center;
                    padding: 2rem;
                    background: rgba(255, 255, 255, 0.1);
                    backdrop-filter: blur(10px);
                    border-radius: 20px;
                }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>500</h1>
                <h2>Server Error</h2>
                <p>Something went wrong. Please try again later.</p>
            </div>
        </body>
        </html>
        EOF
        
        # Create deployment package
        cd app
        zip -r ../app.zip .
        cd ..
        
        echo "✅ Deployment package created successfully"
    
    - name: Configure App Service
      run: |
        APP_NAME="${{ steps.get_app_details.outputs.app_name }}"
        RESOURCE_GROUP="${{ steps.get_app_details.outputs.resource_group }}"
        
        echo "⚙️ Configuring App Service..."
        
        # Set startup command
        az webapp config set \
          --resource-group "$RESOURCE_GROUP" \
          --name "$APP_NAME" \
          --startup-file "/home/site/wwwroot/startup.sh" \
          --linux-fx-version "PYTHON|3.9"
        
        # Update app settings
        az webapp config appsettings set \
          --resource-group "$RESOURCE_GROUP" \
          --name "$APP_NAME" \
          --settings \
            WEBSITES_PORT=8080 \
            PORT=8080 \
            WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
            SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            ENABLE_ORYX_BUILD=false \
            PYTHON_ENABLE_GUNICORN_MULTIWORKERS=false
    
    - name: Deploy to Azure Web App
      run: |
        APP_NAME="${{ steps.get_app_details.outputs.app_name }}"
        RESOURCE_GROUP="${{ steps.get_app_details.outputs.resource_group }}"
        
        echo "🚀 Deploying to Azure Web App..."
        
        az webapp deployment source config-zip \
          --resource-group "$RESOURCE_GROUP" \
          --name "$APP_NAME" \
          --src app.zip \
          --timeout 600
        
        echo "✅ Deployment completed"
    
    - name: Wait for deployment to stabilize
      run: |
        echo "⏳ Waiting for application to start..."
        sleep 60
    
    - name: Verify deployment
      run: |
        APP_URL="${{ steps.get_app_details.outputs.app_url }}"
        
        echo "🧪 Verifying deployment..."
        
        # Test main page
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ Main page responding (HTTP $HTTP_CODE)"
        else
          echo "❌ Main page returned HTTP $HTTP_CODE"
          exit 1
        fi
        
        # Test health endpoint
        HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health")
        if [ "$HEALTH_CODE" = "200" ]; then
          echo "✅ Health endpoint responding (HTTP $HEALTH_CODE)"
        else
          echo "⚠️ Health endpoint returned HTTP $HEALTH_CODE"
        fi
    
    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: app.zip
        retention-days: 7

  # Job 3: Security Tests
  security-tests:
    name: 'Security Tests'
    runs-on: ubuntu-latest
    needs: [terraform, deploy]
    if: always() && needs.deploy.result == 'success'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.ARM_CLIENT_ID }}
        tenant-id: ${{ secrets.ARM_TENANT_ID }}
        subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    
    - name: Get App Service details
      id: get_app_details
      run: |
        # Get values from previous job or Azure
        if [ -z "${{ needs.terraform.outputs.app_name }}" ]; then
          APP_NAME=$(az webapp list --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} --query "[0].name" -o tsv)
          RESOURCE_GROUP=${{ secrets.RESOURCE_GROUP_NAME }}
          APP_URL="https://${APP_NAME}.azurewebsites.net"
        else
          APP_NAME="${{ needs.terraform.outputs.app_name }}"
          RESOURCE_GROUP="${{ needs.terraform.outputs.resource_group }}"
          APP_URL="${{ needs.terraform.outputs.app_url }}"
        fi
        
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
        echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
    
    - name: Run security tests
      run: |
        APP_URL="${{ steps.get_app_details.outputs.app_url }}"
        APP_NAME="${{ steps.get_app_details.outputs.app_name }}"
        RESOURCE_GROUP="${{ steps.get_app_details.outputs.resource_group }}"
        
        echo "🔒 Running security tests..."
        python test_security.py "$APP_URL" --app-name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-test-results
        path: security_test_report.json
        retention-days: 30
    
    - name: Parse test results
      if: always()
      id: parse_results
      run: |
        if [ -f security_test_report.json ]; then
          TOTAL=$(jq '.summary.total_tests' security_test_report.json)
          PASSED=$(jq '.summary.passed' security_test_report.json)
          FAILED=$(jq '.summary.failed' security_test_report.json)
          
          echo "total_tests=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed_tests=$PASSED" >> $GITHUB_OUTPUT
          echo "failed_tests=$FAILED" >> $GITHUB_OUTPUT
          
          echo "📊 Test Summary: $PASSED/$TOTAL passed"
          
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ $FAILED tests failed"
            jq '.results[] | select(.passed == false) | "  - \(.test): \(.message)"' -r security_test_report.json
          fi
        fi
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let comment = '## 🔒 Security Test Results\n\n';
          
          if (fs.existsSync('security_test_report.json')) {
            const report = JSON.parse(fs.readFileSync('security_test_report.json', 'utf8'));
            const { total_tests, passed, failed } = report.summary;
            
            comment += `✅ **Passed:** ${passed}/${total_tests}\n`;
            if (failed > 0) {
              comment += `❌ **Failed:** ${failed}\n\n`;
              comment += '### Failed Tests:\n';
              report.results.filter(r => !r.passed).forEach(r => {
                comment += `- **${r.test}:** ${r.message}\n`;
              });
            }
            
            comment += '\n### All Tests:\n';
            report.results.forEach(r => {
              const icon = r.passed ? '✅' : '❌';
              comment += `${icon} ${r.test}\n`;
            });
          } else {
            comment += '⚠️ No test results found';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          })
    
    - name: Fail if security tests failed
      if: steps.parse_results.outputs.failed_tests > 0
      run: |
        echo "❌ Security tests failed. Please review the results above."
        exit 1